name: 🔧 Start a push
description: Something you want to build, break, or take further on this site.
title: "[push] "
labels: ["board"]
body:
  - type: markdown
    attributes:
      value: |
        **This is a build floor, not a request desk.** You're not asking for something to be
        made for you — you're saying what you're going at, so others can join in or stay clear.

        Check [the shelf](https://github.com/ladymillard/Mira-cle/releases) first: someone may
        have already hit this wall and mapped it.
  - type: textarea
    id: push
    attributes:
      label: What are you pushing on?
      description: The thing that annoys you, the feature that doesn't exist, or the limit you want to find.
      placeholder: I want to see what happens if…
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of push is this?
      options:
        - Build — make something that isn't here yet
        - Break — find where this falls over and document it
        - Both — build it badly on purpose to find the edge
    validations:
      required: true
  - type: textarea
    id: interesting
    attributes:
      label: Why is this worth the room's time?
      description: >
        What would we learn? A limit that gets mapped is as valuable as a feature that ships —
        say which one you're after.
    validations:
      required: true
  - type: textarea
    id: help
    attributes:
      label: Want anyone in on it?
      description: Optional. Say if you want company, a reviewer, or to be left alone with it.
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Before you start
      options:
        - label: I checked the shelf and this wall isn't already mapped.
          required: false
        - label: I understand this work is public, and contains nothing commercially sensitive.
          required: true

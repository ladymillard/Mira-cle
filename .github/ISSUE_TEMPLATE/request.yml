name: 🎟️ Bring a job to the queue
description: Something you need built. Mira builds it in the open; you keep 100% of what it makes.
title: "[job] "
labels: ["queue"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you file:** check [the shelf](https://github.com/ladymillard/Mira-cle/releases) —
        the thing you need may already exist and be ready to fork.

        Jobs are ordered by the room's 👍, not by who asked first. They're worked in
        public, and **everything built for you is yours outright** — no cut, no revenue share.
  - type: textarea
    id: outcome
    attributes:
      label: What do you need to be able to do?
      description: >
        The outcome, not the method. "People should book me without texting me" beats
        "build me a React calendar component" — how it gets built is Mira's problem.
      placeholder: I need to be able to…
    validations:
      required: true
  - type: textarea
    id: blocked
    attributes:
      label: What's this unblocking?
      description: >
        What happens once it exists — money you stop losing, a fee you stop paying, work you
        can finally bid for. This context is usually what makes a result good rather than merely correct.
      placeholder: Right now I'm losing / paying / turning down…
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Which kind of win is this?
      options:
        - Earn — something I can sell
        - Save — replacing something I currently pay for
        - Win — unlocking work I can't currently bid for
        - Not sure yet
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: What would "done" look like?
      description: How would you know this worked? Optional, but it sharpens the result a lot.
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Before filing
      options:
        - label: I checked the shelf and this isn't already built.
          required: false
        - label: I understand this job is worked in public, and contains nothing commercially sensitive.
          required: true
